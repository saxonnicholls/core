name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # so a release tag is graded by the same matrix
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `cmake --build --parallel` with no number lets make start a job per target at once; on a 4-CPU, 16 GB runner a
# GCC Debug build of every test then runs out of memory and the runner is shut down. Hosted runners have 3 or 4
# CPUs, so build with 4 jobs; --parallel takes this when it is given no number.
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

# Every leg blocks except Windows, which reports without gating while no consumer builds there: core sits
# under every other snicholls library, so a compiler core does not build on is one the family cannot use.
# The throughput tables are informational. The documentation is published to GitHub Pages: main to /main/,
# each release tag to its own /vX.Y.Z/, and the site's root to the newest release.
jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 GCC
            os: ubuntu-latest
            cxx: g++
          - name: Linux x86-64 Clang
            os: ubuntu-latest
            cxx: clang++
            sanitize: address,undefined
          - name: Linux ARM64 GCC
            os: ubuntu-24.04-arm
            cxx: g++
          - name: Linux ARM64 Clang
            os: ubuntu-24.04-arm
            cxx: clang++
            sanitize: address,undefined
          - name: macOS ARM64 Apple Clang
            os: macos-latest
            cxx: c++
          - name: macOS x86-64 Apple Clang
            os: macos-15-intel
            cxx: c++
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Static properties of the tree, checked on every job rather than
      # discovered on the one platform that happens to notice
      - name: Version is the same everywhere
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/check_version.py

      - name: Every header has a registered test and demo
        run: python3 scripts/check_mirror.py

      - name: Configure (Release, warnings are errors, benchmarks smoke-run)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DSNICHOLLS_CORE_WERROR=ON
          -DSNICHOLLS_CORE_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Every benchmark against its hand-written equivalent, as tables in this job's summary; a shared runner is
      # noisy, so the numbers are a record per platform, not a gate (BENCHMARKS.md holds the quiet-machine ones).
      - name: Throughput (informational)
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/benchmarks_md.py --build build --min-time 0.2 --output - \
            --title "Throughput - ${{ matrix.name }}" --json bench-json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the raw benchmark results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}-${{ matrix.cxx }}
          path: bench-json/
          if-no-files-found: ignore

      # Without -g: CI never reads the debug information, and GCC's for these template-heavy tests is what pushed
      # the 16 GB ARM64 runner out of memory with four jobs. The Release tree is removed first for its disk.
      - name: Configure, build and test (Debug, -O0, asserts live)
        run: >
          rm -rf build
          && cmake -B build-debug -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS_DEBUG=-O0
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DSNICHOLLS_CORE_WERROR=ON
          && cmake --build build-debug --parallel
          && ctest --test-dir build-debug --output-on-failure

      - name: Address + UB Sanitizers
        if: matrix.sanitize
        run: >
          cmake -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DSNICHOLLS_CORE_WERROR=ON
          -DSNICHOLLS_CORE_SANITIZE=${{ matrix.sanitize }}
          && cmake --build build-san --parallel
          && ctest --test-dir build-san --output-on-failure -LE boundary

  windows:
    name: Windows MSVC
    runs-on: windows-latest
    continue-on-error: true   # not a gate for now: no consumer builds on Windows
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Version is the same everywhere
        run: python3 scripts/check_version.py

      - name: Every header has a registered test and demo
        run: python3 scripts/check_mirror.py

      - name: Configure (warnings are errors)
        run: cmake -B build -DSNICHOLLS_CORE_WERROR=ON -DSNICHOLLS_CORE_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Throughput (informational)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/benchmarks_md.py --build build --config Release --min-time 0.2 --output - \
            --title "Throughput - Windows MSVC" --json bench-json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the raw benchmark results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-windows-msvc
          path: bench-json/
          if-no-files-found: ignore

  docs:
    name: Documentation (warnings are errors)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to publish to the gh-pages branch
    concurrency:
      group: pages           # main and a tag pushed together must not race on gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen

      - name: Configure
        run: cmake -B build -DSNICHOLLS_CORE_BUILD_TESTS=OFF -DSNICHOLLS_CORE_BUILD_DOCS=ON

      - name: Build the documentation
        run: cmake --build build --target docs

      # gh-pages holds generated HTML only, one folder per version; never edit it by hand.
      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DEST: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          trap 'git worktree remove --force "$site" 2>/dev/null || true' EXIT
          git branch -D gh-pages 2>/dev/null || true
          if git fetch --depth 1 origin gh-pages 2>/dev/null; then
            git worktree add "$site" FETCH_HEAD
            git -C "$site" switch -C gh-pages
          else
            git worktree add --detach "$site"
            git -C "$site" switch --orphan gh-pages
          fi
          rm -rf "${site:?}/$DEST" && mkdir -p "$site/$DEST" && cp -R build/docs/html/. "$site/$DEST/"
          touch "$site/.nojekyll"
          latest=$(cd "$site" && ls -d v*/ 2>/dev/null | tr -d / | sort -V | tail -1 || true)
          target=${latest:-main}
          printf '<!DOCTYPE html>\n<meta charset="utf-8">\n<title>snicholls-core</title>\n<meta http-equiv="refresh" content="0; url=%s/">\n<p>The documentation for <a href="%s/">snicholls-core %s</a>; every version: %s</p>\n' \
            "$target" "$target" "$target" "$(cd "$site" && ls -d main v*/ 2>/dev/null | tr -d / | sort -V | sed 's|.*|<a href="&/">&</a>|' | paste -sd ' ' -)" > "$site/index.html"
          git -C "$site" add -A
          if git -C "$site" diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git -C "$site" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "docs: $DEST ($GITHUB_SHA)"
          git -C "$site" push origin gh-pages
