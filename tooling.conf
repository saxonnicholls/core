#
#  The settings tooling's scripts read (third_party/tooling, README "tooling.conf"). Core runs its own check_mirror
#  and check_version; it takes tooling's single include and interface check.

name          = snicholls-core
include_root  = include/snicholls/core
namespace     = snicholls
umbrella      = core.hpp

single_include.snicholls_core = snicholls/core/core.hpp   # single_include/snicholls_core.hpp, the whole library
